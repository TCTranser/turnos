<style>
  /* Identidad visual según el Manual de Marca TRANSER */
  :root {
    /* Primarios */
    --amarillo: #FFC91D; --verde: #81AD3E; --teal: #2A6565; --arena: #E4D49A; --azul: #202E35;
    /* Complementarios */
    --gris: #636D72; --gris-2: #8F969A; --gris-3: #BCC0C2; --amarillo-2: #FFD961; --amarillo-3: #FFEFBB;
    --teal-2: #558484; --teal-3: #BFD1D1; --verde-2: #AECD78; --verde-3: #DCE9C5;
    /* Uso en la interfaz */
    --fondo: #F4F5F5; --tarjeta: #FFFFFF; --texto: var(--azul); --suave: var(--gris); --borde: #DDE0E1; --alerta: #B42318;
    --fuente: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --fuente-2: "Nexa", "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--fuente); background: var(--fondo); color: var(--texto); -webkit-font-smoothing: antialiased; }

  /* Barra superior con el logo en su versión a color sobre blanco (área de protección respetada) */
  .barra { background: #fff; border-bottom: 4px solid var(--amarillo); }
  .barra .cont { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .barra img { height: 44px; width: auto; display: block; }
  .barra .etiqueta { font-family: var(--fuente-2); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); text-align: right; }

  /* Banda de título */
  .banda { background: var(--azul); color: #fff; position: relative; overflow: hidden; }
  .banda::after { /* flecha decorativa inspirada en el símbolo de la marca */
    content: ""; position: absolute; right: -40px; top: 0; bottom: 0; width: 180px;
    background: var(--amarillo); clip-path: polygon(0 0, 45% 0, 100% 50%, 45% 100%, 0 100%, 55% 50%); opacity: .95; }
  .banda .cont { max-width: 760px; margin: 0 auto; padding: 26px 16px 54px; position: relative; z-index: 1; padding-right: 150px; }
  .banda h1 { margin: 0; font-size: 1.9rem; font-weight: 900; letter-spacing: -.01em; line-height: 1.1; }
  .banda p { margin: 8px 0 0; color: var(--arena); font-size: .92rem; font-weight: 500; }

  main { max-width: 760px; margin: -34px auto 0; padding: 0 16px 16px; position: relative; z-index: 2; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(32,46,53,.06); }
  label { display: block; font-size: .85rem; font-weight: 700; color: var(--azul); margin: 12px 0 6px; }
  input { width: 100%; padding: 13px 12px; font-size: 1rem; font-family: var(--fuente); color: var(--azul); border: 1px solid var(--gris-3); border-radius: 8px; background: #fff; }
  input:focus { outline: 3px solid var(--amarillo); outline-offset: 0; border-color: var(--azul); }
  button { margin-top: 16px; width: 100%; padding: 14px; font-size: 1rem; font-weight: 800; font-family: var(--fuente); border: 0; border-radius: 8px; background: var(--amarillo); color: var(--azul); cursor: pointer; letter-spacing: .01em; }
  button:hover { background: var(--amarillo-2); }
  button:disabled { opacity: .6; cursor: wait; }
  button.secundario { background: transparent; color: var(--azul); border: 2px solid var(--azul); font-weight: 700; }
  button.secundario:hover { background: var(--azul); color: #fff; }
  .msg { margin-top: 12px; font-size: .9rem; }
  .msg.error { color: var(--alerta); font-weight: 600; }
  .nota { font-size: .8rem; color: var(--suave); margin: 14px 0 0; line-height: 1.45; padding-left: 10px; border-left: 3px solid var(--verde); }

  /* Hoy / Mañana */
  .hoy { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .hoy div { border-radius: 12px; padding: 16px; color: #fff; position: relative; overflow: hidden; }
  .hoy div:first-child { background: var(--azul); }
  .hoy div:last-child { background: var(--teal); }
  .hoy div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--amarillo); }
  .hoy div:last-child::before { background: var(--verde); }
  .hoy small { display: block; color: var(--arena); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .hoy strong { display: block; font-size: 1.3rem; font-weight: 900; margin-top: 4px; }
  .hoy span { font-size: .9rem; opacity: .9; }

  h2 { font-size: 1.15rem; font-weight: 900; margin: 0 0 4px; color: var(--azul); }
  .sub { font-size: .8rem; color: var(--suave); margin-bottom: 14px; }

  /* Calendario */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dn { text-align: center; font-size: .72rem; color: var(--teal); font-weight: 800; padding-bottom: 4px; text-transform: uppercase; }
  .cal .d { min-height: 60px; border-radius: 6px; border: 1px solid var(--borde); padding: 3px 4px; background: #fff; position: relative; }
  .cal .d.vacio { border: 0; background: transparent; }
  .cal .d .n { font-size: .7rem; color: var(--suave); font-weight: 600; }
  .cal .d.dom .n { color: var(--alerta); font-weight: 800; }
  .cal .d .t { font-size: 1.1rem; font-weight: 900; text-align: center; margin-top: 2px; }
  .cal .d .h { font-size: .62rem; text-align: center; color: inherit; opacity: .85; }
  .cal .d.es-hoy { outline: 3px solid var(--amarillo); outline-offset: 1px; }
  .resumen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: .82rem; }
  .resumen span { background: var(--amarillo-3); color: var(--azul); border-radius: 999px; padding: 5px 11px; font-weight: 600; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .78rem; color: var(--suave); }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--borde); }
  .llegada { border-left: 6px solid var(--verde); }
  .llegada h2 { margin-bottom: 6px; }
  .llegada .fila { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .9rem; margin: 6px 0 2px; }
  .llegada .fila b { font-weight: 800; }
  .llegada button { margin-top: 12px; background: var(--verde); color: #fff; }
  .llegada button:hover { background: var(--teal); }
  .llegada .sin { color: var(--suave); font-size: .9rem; margin: 0; }
  .ausencia { border-left: 6px solid var(--amarillo); }
  .ausencia select, .ausencia textarea { width: 100%; padding: 12px; font-size: 1rem; font-family: var(--fuente); color: var(--azul); border: 1px solid var(--gris-3); border-radius: 8px; background: #fff; }
  .ausencia textarea { min-height: 70px; resize: vertical; }
  .ausencia select:focus, .ausencia textarea:focus { outline: 3px solid var(--amarillo); border-color: var(--azul); }
  .motivos { display: flex; flex-wrap: wrap; gap: 8px; }
  .motivos label { margin: 0; display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px; border: 1px solid var(--gris-3); border-radius: 999px; font-weight: 600; cursor: pointer; background: #fff; }
  .motivos input { width: auto; margin: 0; accent-color: var(--teal); }
  .motivos label:has(input:checked) { background: var(--amarillo-3); border-color: var(--amarillo); }
  .ausencia button { background: var(--azul); color: #fff; }
  .ausencia button:hover { background: var(--teal); }
  details.ausencia > summary { cursor: pointer; font-weight: 900; font-size: 1.15rem; list-style: none; }
  details.ausencia > summary::-webkit-details-marker { display: none; }
  details.ausencia > summary::after { content: " ▾"; color: var(--suave); }
  details.ausencia[open] > summary::after { content: " ▴"; }
  .oculto { display: none; }

  /* Pie */
  footer { background: var(--azul); color: var(--gris-3); margin-top: 24px; }
  footer .cont { max-width: 760px; margin: 0 auto; padding: 18px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; font-size: .78rem; }
  footer strong { color: #fff; font-weight: 800; }
  footer .lema { color: var(--amarillo); font-weight: 700; }

  @media (max-width: 420px) {
    .barra img { height: 36px; }
    .banda h1 { font-size: 1.55rem; }
    .banda .cont { padding-right: 110px; }
    .banda::after { width: 130px; }
    .cal .d { min-height: 50px; } .cal .d .h { display: none; }
  }
</style>
</head>

<script>
(() => {
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  const subtle = window.crypto && window.crypto.subtle;

  const normDoc = s => String(s).toUpperCase().replace(/[^0-9A-Z]/g, '');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const FORM = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=GkjzoYUkr0yFmBXzpZQ7f137oo8tAOdLpc3zcd1xL0hUQk1WMEFHOFJNVExJQjAxU0RWTVYyWDlWQS4u';
  const Q = { emp: 'r10a2690187ca4e09b97da9445201e608', fecha: 'r7c0897f9756a4abb9fccd8bbb57e9c79', turno: 'rf272c69dcd9146d19f97219b6d7b0e3e', ubic: 'r783c9c47964441ffb31fed00c2d3740f', cod: 're95e62bd4ffe4e6f9450ff9e047b5cc3',
    tipo: 'r3e7635f8389240c48a069af112cd0b5c', motivo: 'r67523d465a5a4609bc59e94bc38b375b', obs: 'rb7829e8efb854279aa0cb9433f344e56' };
  const MOTIVOS = ['Calamidad doméstica', 'Incapacidad', 'Otro'];
  const DIAS_AVISO = 7;
  const MIN_ANTES = 60;
  let sesion = null;
  const color = c => /^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\([0-9 ,.]+\))$/.test(c || '') ? c : '';

  function contraste(c) {
    const m = /^#([0-9a-f]{6})/i.exec(c || '');
    if (!m) return '#1c2421';
    const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1c2421' : '#ffffff';
  }

  async function obtener(url) {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('No se pudo leer ' + url);
    return r.json();
  }

  async function descifrar(reg, doc, pin, iter) {
    const base = await subtle.importKey('raw', enc.encode(doc + '|' + pin), 'PBKDF2', false, ['deriveBits']);
    const dk = await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(reg.s), iterations: iter }, base, 256);
    const kDk = await subtle.importKey('raw', dk, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const encRaw = await subtle.sign('HMAC', kDk, enc.encode('enc'));
    const macRaw = await subtle.sign('HMAC', kDk, enc.encode('mac'));
    const kMac = await subtle.importKey('raw', macRaw, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const s = b64(reg.s), iv = b64(reg.iv), ct = b64(reg.ct);
    const datos = new Uint8Array(s.length + iv.length + ct.length);
    datos.set(s, 0); datos.set(iv, s.length); datos.set(ct, s.length + iv.length);
    if (!(await subtle.verify('HMAC', kMac, b64(reg.m), datos))) return null;
    const kEnc = await subtle.importKey('raw', encRaw, 'AES-CTR', false, ['decrypt']);
    const plano = await subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, kEnc, ct);
    return JSON.parse(new TextDecoder().decode(plano));
  }

  async function consultar(docIn, pin) {
    const doc = normDoc(docIn);
    if (!doc || !pin) throw new Error('Escribe tu cédula y tu PIN.');
    const id = hex(await subtle.digest('SHA-256', enc.encode('T24|' + doc))).slice(0, 32);
    const indice = await obtener('data/index.json');
    const hoy = new Date();
    const desde = ymd(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1));
    const hasta = ymd(new Date(hoy.getFullYear(), hoy.getMonth() + 3, 1));
    const candidatos = (indice.archivos || []).filter(a => a.periodo >= desde && a.periodo <= hasta);
    const encontrados = [];
    let pinMalo = false;
    for (const a of candidatos) {
      const arch = await obtener('data/' + a.archivo);
      const reg = (arch.r || []).find(r => r.id === id);
      if (!reg) continue;
      const d = await descifrar(reg, doc, pin, arch.iter);
      if (!d) { pinMalo = true; continue; }
      encontrados.push({ periodo: arch.periodo, grupo: arch.grupo, version: arch.version, generado: arch.generado, turnos: arch.turnos || {}, dato: d });
    }
    if (!encontrados.length) throw new Error(pinMalo ? 'La cédula o el PIN no coinciden.' : 'No hay turnos publicados para esta cédula en los meses recientes.');
    encontrados.sort((x, y) => x.periodo.localeCompare(y.periodo));
    return encontrados;
  }

  function turnoDe(encontrados, fecha) {
    const p = ymd(fecha);
    for (const e of encontrados) {
      if (e.periodo !== p) continue;
      const cod = (e.dato.t || '').split(',')[fecha.getDate() - 1] || '';
      if (cod && !(e.turnos[cod] && e.turnos[cod].d) && cod !== 'D') return { cod, t: e.turnos[cod] };
    }
    for (const e of encontrados) if (e.periodo === p) {
      const cod = (e.dato.t || '').split(',')[fecha.getDate() - 1] || '';
      if (cod) return { cod, t: e.turnos[cod] };
    }
    return null;
  }

  function tarjetaDia(titulo, x) {
    if (!x) return `<div><small>${titulo}</small><strong>Sin programación</strong></div>`;
    const t = x.t || {};
    const desc = t.d || x.cod === 'D';
    const horario = !desc && t.i ? `${esc(t.i)} a ${esc(t.f)}` : '';
    return `<div><small>${titulo}</small><strong>${desc ? 'Descanso' : esc(t.n || x.cod)}</strong><span>${horario}</span></div>`;
  }

  function mes(e) {
    const [y, m] = e.periodo.split('-').map(Number);
    const primero = new Date(y, m - 1, 1);
    const dias = new Date(y, m, 0).getDate();
    const cods = (e.dato.t || '').split(',');
    const hoy = new Date();
    let html = DIAS.map(d => `<div class="dn">${d}</div>`).join('');
    const offset = (primero.getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) html += '<div class="d vacio"></div>';
    const cuenta = {};
    for (let d = 1; d <= dias; d++) {
      const cod = cods[d - 1] || '';
      const t = e.turnos[cod] || {};
      const bg = color(t.c);
      const f = new Date(y, m - 1, d);
      const clases = ['d'];
      if (f.getDay() === 0) clases.push('dom');
      if (f.toDateString() === hoy.toDateString()) clases.push('es-hoy');
      const estilo = bg ? `style="background:${bg};color:${contraste(bg)}"` : '';
      const h = cod && t.i && !t.d ? `${esc(t.i)}-${esc(t.f)}` : '';
      html += `<div class="${clases.join(' ')}" ${estilo} title="${esc(t.n || cod)}"><div class="n" ${bg ? `style="color:${contraste(bg)}"` : ''}>${d}</div><div class="t">${esc(cod)}</div><div class="h">${h}</div></div>`;
      if (cod) cuenta[cod] = (cuenta[cod] || 0) + 1;
    }
    const resumen = Object.entries(cuenta).map(([c, n]) => `<span>${esc((e.turnos[c] && e.turnos[c].n) || c)}: ${n}</span>`).join('');
    const leyenda = Object.entries(e.turnos).map(([c, t]) => `<span><i style="background:${color(t.c) || '#fff'}"></i>${esc(c)} · ${esc(t.n)}${t.i && !t.d ? ' (' + esc(t.i) + '-' + esc(t.f) + ')' : ''}</span>`).join('');
    const gen = e.generado ? new Date(e.generado).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    return `<section class="tarjeta"><h2>${MESES[m - 1][0].toUpperCase() + MESES[m - 1].slice(1)} ${y}</h2>
      <div class="sub">Grupo ${esc(e.grupo)} · versión ${esc(e.version)}${gen ? ' · publicada ' + esc(gen) : ''}</div>
      <div class="cal">${html}</div><div class="resumen">${resumen}</div><div class="leyenda">${leyenda}</div></section>`;
  }

  const iso = d => ymd(d) + '-' + String(d.getDate()).padStart(2, '0');
  const minutos = h => { const q = String(h || '').split(':'); return q.length < 2 ? -1 : Number(q[0]) * 60 + Number(q[1]); };

  // Turno vigente para registrar llegada: hoy o el nocturno que empezó ayer, desde 60 min antes hasta el final.
  function turnoParaLlegada(encontrados) {
    const ahora = new Date();
    for (const delta of [0, -1, 1]) {
      const f = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + delta);
      for (const e of encontrados) {
        if (e.periodo !== ymd(f)) continue;
        const cod = (e.dato.t || '').split(',')[f.getDate() - 1] || '';
        const t = e.turnos[cod];
        if (!cod || cod === 'D' || !t || t.d) continue;
        const ini = minutos(t.i), fin = minutos(t.f);
        if (ini < 0 || fin < 0) continue;
        const inicio = new Date(f.getFullYear(), f.getMonth(), f.getDate(), 0, ini);
        const dur = fin > ini ? fin - ini : fin + 1440 - ini;
        const desde = new Date(inicio.getTime() - MIN_ANTES * 60000), hasta = new Date(inicio.getTime() + dur * 60000);
        if (ahora >= desde && ahora <= hasta) return { fecha: iso(f), cod, t, inicio, emp: e.dato.c || '' };
      }
    }
    return null;
  }

  let llaveLlegada = null;
  function pintarLlegada(forzar) {
    const caja = $('llegada');
    const x = sesion && turnoParaLlegada(sesion.encontrados);
    const llave = x ? x.fecha + '|' + x.cod : '-';
    if (!forzar && llave === llaveLlegada) return;
    llaveLlegada = llave;
    if (!x || !x.emp) {
      caja.innerHTML = `<h2>Registrar mi llegada</h2><p class="sin">El registro se habilita desde ${MIN_ANTES} minutos antes del inicio de tu turno y hasta que termina.</p>`;
      return;
    }
    const hora = x.inicio.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
    caja.innerHTML = `<h2>Registrar mi llegada</h2>
      <div class="fila"><span><b>${esc(x.t.n || x.cod)}</b> (${esc(x.cod)})</span><span>${esc(hora)}</span><span>${esc(x.t.i)} a ${esc(x.t.f)}</span></div>
      <button id="btnLlegada" type="button">Confirmar que llegué</button>
      <div id="msgLlegada" class="msg" role="status" aria-live="polite"></div>
      <p class="nota">Al confirmar se registra la hora y la ubicación de tu dispositivo (latitud y longitud) solo para validar tu asistencia, según la Ley 1581 de 2012 de protección de datos. Se abrirá un formulario ya diligenciado: solo debes presionar <b>Enviar</b>.</p>`;
    $('btnLlegada').addEventListener('click', () => registrarLlegada(x));
  }

  function ubicacion() {
    return new Promise(res => {
      if (!navigator.geolocation) return res('sin ubicacion');
      navigator.geolocation.getCurrentPosition(
        p => res(p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6) + ',' + Math.round(p.coords.accuracy)),
        () => res('sin ubicacion'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }

  async function registrarLlegada(x) {
    const msg = $('msgLlegada'), btn = $('btnLlegada');
    // Abrir la pestaña de inmediato para que el navegador no la bloquee.
    const ventana = window.open('', '_blank');
    btn.disabled = true; btn.textContent = 'Obteniendo ubicación…'; msg.textContent = ''; msg.className = 'msg';
    try {
      const ub = await ubicacion();
      const codigo = hex(await subtle.digest('SHA-256', enc.encode(['ASIS', sesion.doc, sesion.pin, x.emp, x.fecha, x.cod].join('|')))).slice(0, 16);
      const url = urlForm([[Q.emp, x.emp], [Q.fecha, x.fecha], [Q.turno, x.cod], [Q.ubic, ub], [Q.cod, codigo], [Q.tipo, 'Llegada']]);
      if (ventana) ventana.location.href = url; else window.location.href = url;
      msg.textContent = ub === 'sin ubicacion'
        ? 'No se pudo obtener la ubicación (permiso negado o sin señal). El registro quedará sin ubicación. Presiona Enviar en el formulario.'
        : 'Formulario abierto. Presiona Enviar para completar tu registro.';
      if (ub === 'sin ubicacion') msg.className = 'msg error';
    } catch (e) {
      if (ventana) ventana.close();
      msg.textContent = 'No fue posible preparar el registro.'; msg.className = 'msg error';
    } finally {
      btn.disabled = false; btn.textContent = 'Confirmar que llegué';
    }
  }

  const urlForm = pares => FORM + '&' + pares.map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');

  // Turnos de trabajo que aún no terminan, de hoy (o el nocturno de ayer) a DIAS_AVISO días.
  function turnosProximos(encontrados) {
    const ahora = new Date(), lista = [];
    for (let delta = -1; delta <= DIAS_AVISO; delta++) {
      const f = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + delta);
      for (const e of encontrados) {
        if (e.periodo !== ymd(f)) continue;
        const cod = (e.dato.t || '').split(',')[f.getDate() - 1] || '';
        const t = e.turnos[cod];
        if (!cod || cod === 'D' || !t || t.d) continue;
        const ini = minutos(t.i), fin = minutos(t.f);
        if (ini < 0 || fin < 0) continue;
        const inicio = new Date(f.getFullYear(), f.getMonth(), f.getDate(), 0, ini);
        const fin2 = new Date(inicio.getTime() + (fin > ini ? fin - ini : fin + 1440 - ini) * 60000);
        if (fin2 < ahora) continue;
        lista.push({ fecha: iso(f), cod, t, inicio, emp: e.dato.c || '' });
      }
    }
    return lista.filter(x => x.emp);
  }

  function pintarAusencia() {
    const caja = $('ausencia');
    const lista = sesion ? turnosProximos(sesion.encontrados) : [];
    const abierto = caja.open;
    if (!lista.length) {
      caja.innerHTML = `<summary>No voy a poder llegar</summary><p class="sin" style="margin-top:10px">No tienes turnos de trabajo en los próximos ${DIAS_AVISO} días para reportar.</p>`;
      return;
    }
    const opc = lista.map((x, i) => {
      const dia = x.inicio.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'short' });
      return `<option value="${i}">${esc(dia)} · ${esc(x.t.n || x.cod)} (${esc(x.t.i)} a ${esc(x.t.f)})</option>`;
    }).join('');
    caja.innerHTML = `<summary>No voy a poder llegar</summary>
      <label for="ausTurno">Turno al que no vas a llegar</label>
      <select id="ausTurno">${opc}</select>
      <label>Motivo</label>
      <div class="motivos">${MOTIVOS.map((m, i) => `<label><input type="radio" name="ausMotivo" value="${esc(m)}">${esc(m)}</label>`).join('')}</div>
      <label for="ausObs">Observación (opcional)</label>
      <textarea id="ausObs" maxlength="400" placeholder="Ej.: número de incapacidad, detalle de la calamidad…"></textarea>
      <button id="btnAusencia" type="button">Reportar inasistencia</button>
      <div id="msgAusencia" class="msg" role="status" aria-live="polite"></div>
      <p class="nota">Avisa lo antes posible para poder cubrir tu turno. Si es incapacidad, entrega el soporte a tu supervisor. Se abrirá un formulario ya diligenciado: solo debes presionar <b>Enviar</b>.</p>`;
    caja.open = abierto;
    $('btnAusencia').addEventListener('click', () => reportarAusencia(lista));
  }

  async function reportarAusencia(lista) {
    const msg = $('msgAusencia');
    msg.textContent = ''; msg.className = 'msg';
    const x = lista[Number($('ausTurno').value)];
    const sel = document.querySelector('input[name="ausMotivo"]:checked');
    if (!x) return;
    if (!sel) { msg.textContent = 'Selecciona el motivo.'; msg.className = 'msg error'; return; }
    const motivo = sel.value;
    const obs = $('ausObs').value.replace(/\s+/g, ' ').trim().slice(0, 400);
    const ventana = window.open('', '_blank');
    try {
      const codigo = hex(await subtle.digest('SHA-256', enc.encode(['AUS', sesion.doc, sesion.pin, x.emp, x.fecha, x.cod, motivo].join('|')))).slice(0, 16);
      const url = urlForm([[Q.emp, x.emp], [Q.fecha, x.fecha], [Q.turno, x.cod], [Q.ubic, 'no aplica'], [Q.cod, codigo], [Q.tipo, 'Inasistencia'], [Q.motivo, motivo], [Q.obs, obs]]);
      if (ventana) ventana.location.href = url; else window.location.href = url;
      msg.textContent = 'Formulario abierto. Presiona Enviar para completar el reporte.';
    } catch (e) {
      if (ventana) ventana.close();
      msg.textContent = 'No fue posible preparar el reporte.'; msg.className = 'msg error';
    }
  }

  function mostrar(encontrados) {
    const nombre = encontrados[encontrados.length - 1].dato.n || '';
    $('saludo').innerHTML = `<h2>Hola, ${esc(nombre)}</h2><div class="sub" style="margin:0">Estos son tus turnos publicados. Cualquier cambio aparecerá aquí cuando se publique.</div>`;
    const hoy = new Date(), man = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + 1);
    $('hoy').innerHTML = tarjetaDia('Hoy', turnoDe(encontrados, hoy)) + tarjetaDia('Mañana', turnoDe(encontrados, man));
    $('meses').innerHTML = encontrados.map(mes).join('');
    pintarLlegada(true);
    $('ausencia').open = false;
    pintarAusencia();
    $('acceso').classList.add('oculto');
    $('resultado').classList.remove('oculto');
  }

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const msg = $('msg'), btn = $('btn');
    msg.textContent = ''; msg.className = 'msg';
    if (!subtle) { msg.textContent = 'Este navegador no permite la consulta segura. Abre la página con https en un navegador actualizado.'; msg.className = 'msg error'; return; }
    btn.disabled = true; btn.textContent = 'Consultando…';
    try {
      const doc = normDoc($('doc').value), pin = $('pin').value.trim();
      const encontrados = await consultar(doc, pin);
      sesion = { doc, pin, encontrados };
      mostrar(encontrados);
      $('pin').value = '';
    } catch (e) {
      msg.textContent = e.message || 'No fue posible consultar.'; msg.className = 'msg error';
    } finally {
      btn.disabled = false; btn.textContent = 'Consultar mis turnos';
    }
  });

  setInterval(() => { if (sesion) pintarLlegada(); }, 60000);
  setInterval(() => { if (sesion && !$('ausencia').open) pintarAusencia(); }, 300000);

  $('salir').addEventListener('click', () => {
    sesion = null;
    $('meses').innerHTML = ''; $('hoy').innerHTML = ''; $('saludo').innerHTML = ''; $('llegada').innerHTML = ''; $('ausencia').innerHTML = '';
    $('doc').value = ''; $('pin').value = '';
    $('resultado').classList.add('oculto'); $('acceso').classList.remove('oculto');
  });
})();
</script>
</body>
</html>
